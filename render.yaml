# ---------------------------------------------------------------------------
# Blueprint de Render para el Sistema Empresarial (Django).
#
# La base de datos se aloja en Neon (PostgreSQL serverless); sólo hay que
# pegar la cadena de conexión en la variable DATABASE_URL al desplegar.
# ---------------------------------------------------------------------------
services:
  - type: web
    name: sistema-empresarial
    runtime: python
    plan: free
    autoDeploy: true
    # El código vive en una subcarpeta del repositorio: Render debe entrar
    # ahí para encontrar manage.py y requirements.txt.
    rootDir: sistema-empresarial
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate
    startCommand: gunicorn core_project.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      # Cadena de conexión de Neon (se introduce manualmente en el panel).
      - key: DATABASE_URL
        sync: false
